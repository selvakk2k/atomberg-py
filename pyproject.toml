[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyatomberg"
version = "0.1.0"
description = "Python library for Atomberg smart door locks (SL1 / SL1 Pro) with native zero-snoop BLE pairing and cloud key sync"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [
    { name = "Selvakumar", email = "selvakk2k@users.noreply.github.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aiohttp>=3.9.0",
    "bleak>=0.21.0",
    "cryptography>=41.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
pyatomberg = "pyatomberg.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pyatomberg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
